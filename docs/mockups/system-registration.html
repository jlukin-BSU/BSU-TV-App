<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSU AV — System Registration &amp; Remote (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Tokens lifted from src/server/manage/page.ts and src/web/index.css */
  :root{
    --red:#c41230; --bg:#141414; --panel:#1f1f1f; --line:rgba(255,255,255,.14);
    --text:#f5f5f5; --muted:#a0a0a0;
    --gold-bg:#5a4b00; --gold:#ffd94a;
    --ok-bg:rgba(30,125,60,.18); --ok-line:rgba(30,125,60,.5); --ok:#8ff0ad;
    --err-bg:rgba(196,18,48,.16); --err-line:rgba(196,18,48,.5); --err:#ff9aa8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

  header{padding:1.1rem 1.25rem;border-bottom:1px solid var(--line);display:flex;
         align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;
         position:sticky;top:0;background:var(--bg);z-index:30}
  header h1{font-size:1.15rem;margin:0;font-weight:700;letter-spacing:.01em}
  header .sub{color:var(--muted);font-size:.8rem;margin-top:.15rem}
  .tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;
       padding:.1rem .45rem;border-radius:999px;vertical-align:middle}
  .tag.dry{background:var(--gold-bg);color:var(--gold)}

  nav{display:flex;gap:.4rem}
  nav button{font-family:inherit;font-size:.9rem;font-weight:600;border:none;border-radius:10px;
             padding:.5rem .95rem;cursor:pointer;background:rgba(255,255,255,.08);color:var(--text)}
  nav button[aria-selected="true"]{background:var(--red);color:#fff}

  main{max-width:820px;margin:0 auto;padding:1.25rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:1rem 1.1rem;margin-bottom:.9rem}
  h2{font-size:1.05rem;margin:.2rem 0 0}
  .muted{color:var(--muted);font-size:.85rem}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:.9rem;gap:.8rem}

  button{font-family:inherit;font-size:1rem;font-weight:600;border:none;border-radius:10px;
         padding:.7rem 1.1rem;cursor:pointer}
  .primary{background:var(--red);color:#fff}
  .ghost{background:rgba(255,255,255,.08);color:var(--text)}
  .small{padding:.45rem .8rem;font-size:.85rem}
  select{font-family:inherit;font-size:.9rem;color:var(--text);background:#141414;
         border:1px solid var(--line);border-radius:10px;padding:.5rem .6rem;outline:none}
  select:focus{border-color:var(--red)}

  /* device / system rows — .device from the management page */
  .device{display:flex;align-items:center;justify-content:space-between;gap:.8rem;
          width:100%;text-align:left;background:rgba(255,255,255,.05);border:1px solid transparent;
          border-radius:10px;padding:.6rem .7rem;margin-bottom:.4rem;cursor:pointer;
          font-family:inherit;font-weight:400;color:var(--text)}
  .device:hover{background:rgba(255,255,255,.08)}
  .device[aria-current="true"]{border-color:var(--red);background:rgba(196,18,48,.12)}
  .device .meta{min-width:0}
  .device .name{font-weight:600;font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .device .addr{color:var(--muted);font-size:.85rem;margin-top:.15rem}
  .device .chips{margin-top:.3rem;display:flex;gap:.3rem;flex-wrap:wrap}

  .chip{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
        padding:.12rem .45rem;border-radius:999px}
  .c-tv{background:rgba(255,255,255,.12);color:var(--text)}
  .c-str{background:var(--gold-bg);color:var(--gold)}
  .c-ctl{background:var(--ok-bg);color:var(--ok)}
  .c-na{background:rgba(255,255,255,.06);color:var(--muted)}

  /* role blocks */
  .role{background:rgba(255,255,255,.05);border-radius:10px;padding:.7rem .8rem;margin-bottom:.5rem}
  .role .rh{display:flex;align-items:center;gap:.5rem;margin-bottom:.35rem}
  .role .rk{color:var(--muted);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em}
  .role .rm{font-weight:600;font-size:1rem}
  .role .kv{display:flex;justify-content:space-between;gap:1rem;font-size:.82rem;color:var(--muted);padding:.1rem 0}
  .role .kv code{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:var(--text)}
  .role.empty{opacity:.75}
  .role.empty p{margin:.2rem 0 0;font-size:.85rem;color:var(--muted)}
  .state{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;
         padding:.1rem .5rem;border-radius:999px}
  .state.ok{background:var(--ok-bg);color:var(--ok)}
  .state.warn{background:var(--gold-bg);color:var(--gold)}
  .dot{width:.4rem;height:.4rem;border-radius:50%;background:currentColor}

  /* routing rows — .titem from the management page */
  .titem{display:flex;align-items:center;gap:.5rem;padding:.5rem .6rem;border-radius:10px;
         background:rgba(255,255,255,.05);margin-bottom:.4rem}
  .titem .tname{flex:1;font-size:.95rem}
  .titem .how{color:var(--muted);font-size:.75rem;font-family:ui-monospace,Consolas,monospace}
  .titem.na .tname{color:var(--muted)}

  /* options — .chk from the management page */
  .chk{display:flex;align-items:flex-start;gap:.6rem;margin-top:.9rem;font-size:.95rem}
  .chk:first-child{margin-top:.2rem}
  .chk input{width:1.2rem;height:1.2rem;accent-color:var(--red);margin-top:.15rem;flex:0 0 auto}
  .chk .d{color:var(--muted);font-size:.8rem;margin-top:.15rem}
  .chk.disabled{opacity:.45}
  .optrow{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-top:.9rem}

  .msg{padding:.7rem .9rem;border-radius:10px;font-size:.9rem;margin-bottom:.9rem}
  .msg.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
  .msg.note{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--muted)}
  .hidden{display:none!important}

  /* ---------- remote: hub surface (src/web/index.css) ---------- */
  #view-rem main{max-width:820px}
  .stage{background:radial-gradient(ellipse at 50% 0%, #303030 0%, #222222 70%);
         border:1px solid var(--line);border-radius:14px;padding:1.6rem;
         display:flex;gap:1.6rem;flex-wrap:wrap;justify-content:center;align-items:flex-start;
         font-family:'Inter',"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .remote{width:15rem;display:grid;gap:.95rem;justify-items:center}
  .rrow{display:flex;gap:.9rem;justify-content:center;align-items:flex-start}
  .gbtn{border:none;cursor:pointer;color:#fff;background:rgba(255,255,255,.07);
        box-shadow:0 .4rem 1.2rem rgba(0,0,0,.3), 0 0 0 1px rgba(255,255,255,.09);
        backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
        display:grid;place-items:center;transition:background .15s, box-shadow .15s, transform .15s}
  .gbtn:hover{background:rgba(255,255,255,.12);transform:translateY(-2px);
              box-shadow:0 .8rem 1.8rem rgba(0,0,0,.45), 0 0 1.6rem .3rem rgba(220,40,65,.18)}
  .gbtn:active{transform:translateY(0)}
  .gbtn svg{width:1.25rem;height:1.25rem;fill:currentColor}
  .circ{width:2.9rem;height:2.9rem;border-radius:50%}
  .btnwrap{display:grid;justify-items:center;gap:.25rem}
  .blab{font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55)}
  .pwr{color:#ff8a95}

  .dpad{position:relative;width:11rem;height:11rem;border-radius:50%;
        background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
        display:grid;place-items:center}
  .dpad button{position:absolute;border:none;background:transparent;color:#fff;cursor:pointer;
               width:2.9rem;height:2.9rem;display:grid;place-items:center;border-radius:.8rem}
  .dpad button:hover{background:rgba(255,255,255,.10)}
  .dpad button svg{width:1.5rem;height:1.5rem;fill:currentColor}
  .dpad .up{top:.25rem}.dpad .down{bottom:.25rem}.dpad .left{left:.25rem}.dpad .right{right:.25rem}
  .dpad .ok{position:relative;width:4.4rem;height:4.4rem;border-radius:50%;
            background:rgba(255,255,255,.12);box-shadow:0 0 0 1px rgba(255,255,255,.14);
            font-family:inherit;font-weight:600;font-size:.82rem;letter-spacing:.08em;color:#fff}
  .dpad .ok:hover{background:rgba(255,255,255,.2);box-shadow:0 0 1.6rem .3rem rgba(220,40,65,.18)}

  .volstack{display:grid;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;
            box-shadow:0 0 0 1px rgba(255,255,255,.09)}
  .volstack button{width:2.9rem;height:2.7rem;border:none;background:transparent;color:#fff;cursor:pointer;
                   display:grid;place-items:center}
  .volstack button:hover{background:rgba(255,255,255,.12)}
  .volstack svg{width:1.25rem;height:1.25rem;fill:currentColor}
  .volsep{height:1px;background:rgba(255,255,255,.12)}

  .sidenote{flex:1;min-width:17rem;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .sidenote ul{margin:.4rem 0 0;padding-left:1.05rem;color:var(--muted);font-size:.85rem}
  .sidenote li{margin-bottom:.4rem}
  .sidenote code{font-family:ui-monospace,Consolas,monospace;color:var(--text);font-size:.8rem}
  [hidden]{display:none!important}
</style>
</head>
<body>

<header>
  <div>
    <h1>BSU AV — System Registration <span class="tag dry">MOCKUP</span></h1>
    <div class="sub">Sample data only — no live devices</div>
  </div>
  <nav role="tablist">
    <button role="tab" id="tab-reg" aria-selected="true" onclick="showTab('reg')">Systems</button>
    <button role="tab" id="tab-rem" aria-selected="false" onclick="showTab('rem')">Remote</button>
  </nav>
</header>

<!-- ================= REGISTRATION ================= -->
<div id="view-reg">
<main>
  <div class="card">
    <div class="toolbar"><h2>Registered systems</h2><button class="ghost small">Add system</button></div>
    <div id="syslist"></div>
  </div>

  <div class="card">
    <div class="toolbar"><h2 id="detail-title">—</h2></div>
    <div id="roles"></div>
  </div>

  <div class="card">
    <div class="toolbar"><h2>Command routing</h2><span class="muted">derived</span></div>
    <div id="routing"></div>
  </div>

  <div class="card">
    <div class="toolbar"><h2>Per-system options</h2><span class="muted">can't be inferred</span></div>
    <div id="opts"></div>
  </div>

  <div class="card">
    <div class="toolbar"><h2>Add a system — discovery</h2><button class="ghost small">Rescan</button></div>
    <div id="found"></div>
    <p class="muted" style="margin:.8rem 0">Roles are pre-filled from the probe and require confirmation.</p>
    <button class="primary">Create system from selected</button>
  </div>
</main>
</div>

<!-- ================= REMOTE ================= -->
<div id="view-rem" hidden>
<main>
  <div class="card">
    <div class="toolbar">
      <h2>Controller remote</h2>
      <select id="remote-sys" onchange="renderRemote()"></select>
    </div>
    <div class="stage">
      <div class="remote" id="remote"></div>
      <div class="sidenote">
        <h2 style="font-size:.95rem;margin-bottom:.5rem">Key map</h2>
        <div id="keymap"></div>
      </div>
    </div>
  </div>
</main>
</div>

<script>
const I = {
  up:'<svg viewBox="0 0 24 24"><path d="M12 8.4 5.7 14.7l1.4 1.4L12 11.2l4.9 4.9 1.4-1.4z"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 15.6 5.7 9.3l1.4-1.4L12 12.8l4.9-4.9 1.4 1.4z"/></svg>',
  left:'<svg viewBox="0 0 24 24"><path d="M14.7 18.3 8.4 12l6.3-6.3 1.4 1.4L11.2 12l4.9 4.9z"/></svg>',
  right:'<svg viewBox="0 0 24 24"><path d="M9.3 5.7 15.6 12l-6.3 6.3-1.4-1.4L12.8 12 7.9 7.1z"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M10 19v-5h4v5h5v-7h3L12 3 2 12h3v7z"/></svg>',
  volUp:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05A4.47 4.47 0 0 0 16.5 12M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4-.91 7-4.49 7-8.77s-3-7.86-7-8.77"/></svg>',
  volDn:'<svg viewBox="0 0 24 24"><path d="M18.5 12A4.5 4.5 0 0 0 16 7.97v8.05A4.47 4.47 0 0 0 18.5 12M5 9v6h4l5 5V4L9 9z"/></svg>',
  mute:'<svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63m2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-3-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71M4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9zM12 4 9.91 6.09 12 8.18z"/></svg>',
  play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  power:'<svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2zm4.8 2.2-1.4 1.4A6.99 6.99 0 0 1 19 12a7 7 0 1 1-11.4-5.4L6.2 5.2A9 9 0 1 0 21 12a8.96 8.96 0 0 0-3.2-6.8"/></svg>',
  input:'<svg viewBox="0 0 24 24"><path d="M21 3.01H3c-1.1 0-2 .9-2 2V9h2V4.99h18v14.03H3V15H1v4.01c0 1.1.9 1.98 2 1.98h18c1.1 0 2-.88 2-1.98v-14c0-1.11-.9-2-2-2M11 16l4-4-4-4v3H1v2h10z"/></svg>'
};
const ic = n => I[n] || '';

const SYSTEMS = [
  { id:'rsu008l', name:'RSU 008 — Left', shape:'All-in-one',
    note:'Existing install. Unchanged by the new model — it registers as a single-device system.',
    display:{model:'Sony BRAVIA FW-55BZ30L',driver:'sony-bravia',addr:'tv-rsu008-l',detail:'REST + X-Auth-PSK',status:'ok'},
    streamer:null, controllers:[], opts:{cast:true,inputsBtn:true}, castAvailable:true },
  { id:'rsu012', name:'RSU 012 — Lecture Hall', shape:'TV + streamer',
    note:'New install. The LG panel takes IP control but is not Google-compatible, so the streamer is broken out.',
    display:{model:'LG 86UR340C9UD',driver:'lg-commercial',addr:'tv-rsu012',detail:'ASCII command set over IP',status:'ok'},
    streamer:{model:'Google TV Streamer 4K',driver:'google-tv-adb',addr:'gtv-rsu012',detail:'ADB · HDMI 1',status:'ok'},
    controllers:[], opts:{cast:false,inputsBtn:true}, castAvailable:false },
  { id:'max210', name:'MAX 210 — Studio', shape:'TV + streamer + controllers',
    note:'Full shape. Two wall controllers, each mapped to this system by source IP.',
    display:{model:'Sony BRAVIA FW-65BZ30L',driver:'sony-bravia',addr:'tv-max210',detail:'REST + X-Auth-PSK',status:'ok'},
    streamer:{model:'Google TV Streamer 4K',driver:'google-tv-adb',addr:'gtv-max210',detail:'ADB · HDMI 2',status:'ok'},
    controllers:[{model:'Wall panel — entry',addr:'ctl-max210-a',detail:'paired',status:'ok'},
                 {model:'Wall panel — booth',addr:'ctl-max210-b',detail:'awaiting pairing code',status:'warn'}],
    opts:{cast:true,inputsBtn:false}, castAvailable:true }
];
let current = SYSTEMS[0].id;
const sysById = id => SYSTEMS.find(s => s.id === id);

function routingFor(s){
  const sony = s.display.driver === 'sony-bravia';
  const hasS = !!s.streamer;
  const TV={l:'TV',c:'c-tv'}, ST={l:'Streamer',c:'c-str'}, NA={l:'n/a',c:'c-na'};
  return [
    {cap:'Power',                to:TV, how:sony?'setPowerStatus':'ka'},
    {cap:'Input / source',       to:TV, how:sony?'setPlayContent':'xb'},
    {cap:'Volume / mute',        to:TV, how:sony?'setAudioVolume':'kf / ke'},
    {cap:'Screen off',           to:TV, how:sony?'pictureOff':'kd'},
    {cap:'Cast / AirPlay',       to:s.opts.cast?TV:NA, how:s.opts.cast?'switch to cast input':'off for this system'},
    {cap:'App launch',           to:hasS?ST:TV, how:hasS?'am start':'setActiveApp'},
    {cap:'Wipe app credentials', to:hasS?ST:NA, how:hasS?'pm clear <pkg>':'no equivalent on the panel'},
    {cap:'Foreground app',       to:hasS?ST:NA, how:hasS?'dumpsys activity':'REST errors on apps'},
    {cap:'Home / hub',           to:hasS?ST:TV, how:hasS?'am start — shell':'reload kiosk URL'}
  ];
}

function renderList(){
  document.getElementById('syslist').innerHTML = SYSTEMS.map(s=>{
    const chips = '<span class="chip c-tv">TV</span>'
      + (s.streamer ? '<span class="chip c-str">Streamer</span>' : '')
      + (s.controllers.length ? `<span class="chip c-ctl">${s.controllers.length} controller${s.controllers.length>1?'s':''}</span>` : '');
    return `<button class="device" aria-current="${s.id===current}" onclick="select('${s.id}')">
      <span class="meta">
        <span class="name">${s.name}</span>
        <span class="addr">${s.shape}</span>
        <span class="chips">${chips}</span>
      </span>
    </button>`;
  }).join('');
}

const stateTag = st => st==='ok'
  ? '<span class="state ok"><span class="dot"></span>Reachable</span>'
  : '<span class="state warn"><span class="dot"></span>Pending</span>';

function renderDetail(){
  const s = sysById(current);
  document.getElementById('detail-title').textContent = s.name;

  const role = (kind,d) => `<div class="role">
      <div class="rh"><span class="rk">${kind}</span>${stateTag(d.status)}</div>
      <div class="rm">${d.model}</div>
      <div class="kv"><span>Address</span><code>${d.addr}</code></div>
      ${d.driver?`<div class="kv"><span>Driver</span><code>${d.driver}</code></div>`:''}
      <div class="kv"><span>Control</span><span>${d.detail}</span></div>
    </div>`;

  let h = role('Display / TV', s.display);
  h += s.streamer ? role('Streaming device', s.streamer)
    : `<div class="role empty"><div class="rh"><span class="rk">Streaming device</span></div>
       <p>None — apps run on the panel.</p></div>`;
  h += s.controllers.length ? s.controllers.map(c=>role('Controller', c)).join('')
    : `<div class="role empty"><div class="rh"><span class="rk">Controller</span></div>
       <p>None registered.</p></div>`;
  document.getElementById('roles').innerHTML = h;

  document.getElementById('routing').innerHTML = routingFor(s).map(r=>`
    <div class="titem ${r.to.c==='c-na'?'na':''}">
      <span class="tname">${r.cap}</span>
      <span class="chip ${r.to.c}">${r.to.l}</span>
      <span class="how">${r.how}</span>
    </div>`).join('');

  const noCast = !s.castAvailable;
  document.getElementById('opts').innerHTML = `
    <label class="chk ${noCast?'disabled':''}">
      <input type="checkbox" ${s.opts.cast?'checked':''} ${noCast?'disabled':''} onchange="toggle('cast')">
      <span>Cast / AirPlay available as an input
        ${noCast?'<span class="d">Not reported by this panel.</span>':''}
      </span>
    </label>
    <label class="chk">
      <input type="checkbox" ${s.opts.inputsBtn?'checked':''} onchange="toggle('inputsBtn')">
      <span>Show Inputs button on the remote</span>
    </label>
    <div class="optrow">
      <span>Hub host</span>
      <select>
        <option ${!s.streamer?'selected':''}>Display kiosk browser</option>
        <option ${s.streamer?'selected':''}>Streamer shell app</option>
      </select>
    </div>`;
}

function toggle(k){ const s=sysById(current); s.opts[k]=!s.opts[k]; renderDetail(); renderRemote(); }
function select(id){ current=id; renderList(); renderDetail(); syncRemoteSelect(); }

const FOUND = [
  {m1:'Google TV Streamer 4K', m2:'gtv-bur104 · 10.30.14.62 · mDNS _googlecast._tcp · ADB port found', role:'Streaming device'},
  {m1:'Sony BRAVIA FW-75BZ30L', m2:'tv-bur104 · 10.30.14.61 · SSDP device description', role:'Display / TV'},
  {m1:'Unidentified device', m2:'10.30.14.77 · responds on :80, no SSDP, no mDNS', role:'— choose —'}
];
function renderFound(){
  document.getElementById('found').innerHTML = FOUND.map(f=>`
    <div class="device" style="cursor:default">
      <span class="meta"><span class="name">${f.m1}</span><span class="addr">${f.m2}</span></span>
      <select><option>${f.role}</option><option>Display / TV</option><option>Streaming device</option>
              <option>Controller</option><option>Ignore</option></select>
    </div>`).join('');
}

function syncRemoteSelect(){
  const sel = document.getElementById('remote-sys');
  sel.innerHTML = SYSTEMS.map(s=>`<option value="${s.id}" ${s.id===current?'selected':''}>${s.name}</option>`).join('');
  renderRemote();
}

function renderRemote(){
  const sel = document.getElementById('remote-sys');
  const s = sysById(sel.value || current);
  const b = (icon,label,cls='') =>
    `<span class="btnwrap"><button class="gbtn circ ${cls}">${ic(icon)}</button><span class="blab">${label}</span></span>`;

  document.getElementById('remote').innerHTML = `
    <div class="rrow">${b('power','Power','pwr')}${b('home','Home')}${b('back','Back')}</div>
    <div class="dpad">
      <button class="up">${ic('up')}</button>
      <button class="left">${ic('left')}</button>
      <button class="ok">OK</button>
      <button class="right">${ic('right')}</button>
      <button class="down">${ic('down')}</button>
    </div>
    <div class="rrow">
      <span class="btnwrap">
        <span class="volstack">
          <button title="Volume up">${ic('volUp')}</button>
          <span class="volsep"></span>
          <button title="Volume down">${ic('volDn')}</button>
        </span>
        <span class="blab">Volume</span>
      </span>
      <span style="display:grid;gap:.6rem">${b('mute','Mute')}${b('play','Play')}</span>
    </div>
    ${s.opts.inputsBtn ? `<div class="rrow">${b('input','Inputs')}</div>`
      : `<div class="blab" style="opacity:.5">Inputs button off for this system</div>`}`;

  const hasS = !!s.streamer;
  const TV = '<span class="chip c-tv">TV</span>', ST = '<span class="chip c-str">Streamer</span>';
  const keys = [
    ['Power',      TV,          s.display.driver==='sony-bravia'?'setPowerStatus':'ka'],
    ['Home',       hasS?ST:TV,  hasS?'am start — shell':'reload kiosk URL'],
    ['Back',       hasS?ST:TV,  'keyevent BACK'],
    ['D-pad / OK', hasS?ST:TV,  'keyevent DPAD_*'],
    ['Volume',     TV,          s.display.driver==='sony-bravia'?'setAudioVolume':'kf'],
    ['Mute',       TV,          s.display.driver==='sony-bravia'?'setAudioMute':'ke'],
    ['Play',       hasS?ST:TV,  'keyevent MEDIA_PLAY_PAUSE'],
    ['Inputs',     TV,          s.opts.inputsBtn ? (s.display.driver==='sony-bravia'?'setPlayContent':'xb') : 'hidden']
  ];
  document.getElementById('keymap').innerHTML = keys.map(([k,t,c])=>`
    <div class="titem"><span class="tname">${k}</span>${t}<span class="how">${c}</span></div>`).join('');
}

function showTab(w){
  const reg = w==='reg';
  document.getElementById('view-reg').hidden = !reg;
  document.getElementById('view-rem').hidden = reg;
  document.getElementById('tab-reg').setAttribute('aria-selected', reg);
  document.getElementById('tab-rem').setAttribute('aria-selected', !reg);
}

renderList(); renderDetail(); renderFound(); syncRemoteSelect();
</script>
</body>
</html>
