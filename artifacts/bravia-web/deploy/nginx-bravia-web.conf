##
# nginx site for bravia-web.
#
# Install to /etc/nginx/sites-available/bravia-web and symlink into
# sites-enabled. Replace display-control.example.edu with your real FQDN --
# it must match the Let's Encrypt certificate.
##

# ---------------------------------------------------------------------------
# Port 80: ACME challenges + redirect everything else to HTTPS.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name display-control.example.edu;

    # Leave this reachable so certbot can renew over HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the actual site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name display-control.example.edu;

    ssl_certificate     /etc/letsencrypt/live/display-control.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/display-control.example.edu/privkey.pem;

    # TLS 1.2 is deliberately still enabled. The built-in browser on a BZ30L is
    # an older Chromium and does not reliably negotiate TLS 1.3 -- a 1.3-only
    # config is a blank page on the display with no useful error.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling shortens the handshake for the displays.
    ssl_stapling on;
    ssl_stapling_verify on;

    access_log /var/log/nginx/bravia-web.access.log;
    error_log  /var/log/nginx/bravia-web.error.log;

    # The UI is a handful of small files; no need for large bodies.
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        ##
        # This is the load-bearing part of the whole design.
        #
        # The service identifies which display is calling by the request's
        # source IP, and that identity selects which PSK is used. So the
        # forwarded address must be the one nginx observed on the socket, and
        # must NOT be something the client can influence.
        #
        # $remote_addr OVERWRITES the header. Do not use
        # $proxy_add_x_forwarded_for here -- that appends to whatever the client
        # sent, which would let a display prepend a forged address and, combined
        # with a trust-proxy chain, impersonate another display.
        ##
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}
